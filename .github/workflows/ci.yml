name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: python -m pip install pytest
      - run: python -m pytest tests/ scripts/ -q -p no:cacheprovider
      - run: python scripts/run-jvm-tests.py
      - run: python scripts/validate-s26-model-lab.py --self-test
